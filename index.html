<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moneyball FC Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Moneyball FC Management</h1>
  
  <div id="finance-board">
    <h2>Remaining Budget: €<span id="budget">100</span>M</h2>
  </div>

  <section class="container">
    <div class="market">
      <h3>Transfer Market</h3>
      <div id="player-list"></div>
    </div>

    <div class="squad">
      <h3>Your Squad (<span id="squad-count">0</span>/3)</h3>
      <ul id="my-squad"></ul>
      <button id="sim-btn" onclick="simulateMatch()" disabled>Simulate Match</button>
    </div>
  </section>

  <div id="match-result"></div>

  <script src="script.js"></script>
</body>
</html>
